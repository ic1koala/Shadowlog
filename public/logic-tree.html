<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShadowLog 改善ロジックツリー & 思考整理スタジオ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      user-select: none;
    }
    /* Grid background pattern with 10% opacity */
    .bg-grid {
      background-size: 24px 24px;
      background-image: 
        linear-gradient(to right, rgba(15, 23, 42, 0.10) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 23, 42, 0.10) 1px, transparent 1px);
    }
    .dark .bg-grid {
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.10) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.10) 1px, transparent 1px);
    }
    /* Smooth transition for lines and nodes */
    .tree-node {
      transition: box-shadow 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
    }
    .tree-node:hover {
      transform: translateY(-2px);
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .dark ::webkit-scrollbar-thumb {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 h-screen w-screen overflow-hidden flex flex-col">

  <!-- Top Navigation Bar -->
  <header class="h-14 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 flex items-center justify-between shrink-0 z-30 shadow-xs">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-black text-base shadow-md shadow-indigo-500/20">
        S
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-sm font-extrabold text-slate-900 dark:text-white tracking-tight">ShadowLog Logic Tree Studio</h1>
          <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-indigo-50 text-indigo-600 dark:bg-indigo-950/60 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800">
            改善思考整理マップ
          </span>
        </div>
      </div>
    </div>

    <!-- Search & Filters -->
    <div class="flex items-center gap-2">
      <!-- Search Box -->
      <div class="relative w-44 sm:w-64">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="キーワードで検索・ハイライト..." 
          oninput="handleSearch(this.value)"
          class="w-full pl-8 pr-3 py-1.5 text-xs rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:outline-hidden focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-slate-100"
        >
        <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs">🔍</span>
      </div>

      <!-- Status Filter -->
      <select 
        id="statusFilter" 
        onchange="filterByStatus(this.value)"
        class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-200 focus:outline-hidden cursor-pointer"
      >
        <option value="all">全ステータス表示</option>
        <option value="completed">🚀 実装完了</option>
        <option value="in_progress">⚡️ 進行中</option>
        <option value="idea">💡 検討・アイディア</option>
        <option value="pending">📌 課題・保留</option>
      </select>

      <div class="h-5 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>

      <!-- Quick Action Buttons -->
      <button onclick="expandAll()" class="p-1.5 text-xs rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="すべて展開">
        <span>全展開 📖</span>
      </button>
      <button onclick="collapseToRoots()" class="p-1.5 text-xs rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition" title="主要ブランチに折りたたむ">
        <span>折りたたむ 📁</span>
      </button>

      <div class="h-5 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>

      <!-- Export / Import / Reset -->
      <button onclick="exportData()" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center gap-1">
        <span>💾 保存/エクスポート</span>
      </button>
      <button onclick="triggerImport()" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <span>読込</span>
      </button>
      <input type="file" id="importInput" accept=".json" class="hidden" onchange="handleImportFile(event)">

      <button onclick="resetData()" class="p-1.5 text-xs text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-md transition" title="初期データに戻す">
        <span>リセット</span>
      </button>
    </div>
  </header>

  <!-- Canvas Container with Zoom & Pan -->
  <div class="flex-1 relative overflow-hidden bg-grid cursor-grab active:cursor-grabbing" id="canvasViewport">
    
    <!-- Floating Zoom & Center Controls -->
    <div class="absolute bottom-6 left-6 z-20 flex items-center gap-1.5 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md p-1.5 rounded-xl border border-slate-200 dark:border-slate-800 shadow-lg">
      <button onclick="zoomIn()" class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        ＋
      </button>
      <span id="zoomDisplay" class="text-xs font-bold text-slate-600 dark:text-slate-300 w-12 text-center select-none">
        100%
      </span>
      <button onclick="zoomOut()" class="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        ー
      </button>
      <div class="h-4 w-px bg-slate-200 dark:bg-slate-700 mx-1"></div>
      <button onclick="resetView()" class="px-2.5 h-8 rounded-lg text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center gap-1">
        <span>🎯 中央</span>
      </button>
    </div>

    <!-- Mini Status Legend -->
    <div class="absolute bottom-6 right-6 z-20 hidden md:flex items-center gap-3 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-800 shadow-lg text-xs font-medium text-slate-600 dark:text-slate-300">
      <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>🚀 実装完了</span>
      <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-blue-500"></span>⚡️ 進行中</span>
      <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span>💡 検討・アイディア</span>
      <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>📌 課題・保留</span>
    </div>

    <!-- Scalable Transform Canvas -->
    <div id="treeCanvas" class="absolute top-0 left-0 origin-top-left transition-transform duration-75">
      <!-- SVG Connecting Lines Layer -->
      <svg id="connectionSvg" class="absolute top-0 left-0 pointer-events-none" style="width: 5000px; height: 5000px;"></svg>

      <!-- HTML Nodes Container -->
      <div id="nodesContainer" class="p-20 relative"></div>
    </div>
  </div>

  <!-- Detail / Edit Drawer Sidebar -->
  <aside id="detailDrawer" class="fixed top-14 right-0 bottom-0 w-96 bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 shadow-2xl z-40 transform translate-x-full transition-transform duration-300 flex flex-col">
    <!-- Drawer Header -->
    <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between bg-slate-50 dark:bg-slate-950">
      <div class="flex items-center gap-2">
        <span id="drawerBadge" class="px-2 py-0.5 text-[10px] font-bold rounded-full"></span>
        <span class="text-xs font-semibold text-slate-500">ノード詳細 & 議論メモ</span>
      </div>
      <button onclick="closeDrawer()" class="p-1 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-800 transition">
        ✕
      </button>
    </div>

    <!-- Drawer Content (Edit Form) -->
    <div class="flex-1 overflow-y-auto p-5 space-y-4 text-xs">
      <div>
        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">ノード名 (タイトル)</label>
        <input 
          type="text" 
          id="editTitle" 
          class="w-full px-3 py-2 text-sm font-bold rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-hidden"
        >
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">ステータス</label>
          <select 
            id="editStatus" 
            class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 font-medium"
          >
            <option value="completed">🚀 実装完了 (Completed)</option>
            <option value="in_progress">⚡️ 進行中 (In Progress)</option>
            <option value="idea">💡 検討・アイディア (Idea)</option>
            <option value="pending">📌 課題・保留 (Pending)</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">優先度</label>
          <select 
            id="editPriority" 
            class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 font-medium"
          >
            <option value="high">🔥 高 (High)</option>
            <option value="medium">⚡️ 中 (Medium)</option>
            <option value="low">🌱 低 (Low)</option>
          </select>
        </div>
      </div>

      <div>
        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">概要・目的</label>
        <textarea 
          id="editSummary" 
          rows="3" 
          placeholder="この施策の目的、ユーザーへの価値、背景など..."
          class="w-full px-3 py-2 rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden resize-none leading-relaxed"
        ></textarea>
      </div>

      <div>
        <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">技術仕様・議論メモ・論点</label>
        <textarea 
          id="editNotes" 
          rows="6" 
          placeholder="API設計、課題、アルゴリズム、オーナー様との決定事項など..."
          class="w-full px-3 py-2 font-mono text-[11px] rounded-lg border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-100 focus:ring-2 focus:ring-indigo-500 focus:outline-hidden resize-none leading-relaxed"
        ></textarea>
      </div>

      <!-- Quick Actions for Node -->
      <div class="pt-3 border-t border-slate-200 dark:border-slate-800 space-y-2">
        <button 
          onclick="addChildNodeFromDrawer()" 
          class="w-full py-2.5 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-98 text-white font-bold transition shadow-md shadow-indigo-600/20 flex items-center justify-center gap-2"
        >
          <span>＋ この下に新しいアイディアを追加</span>
        </button>

        <div class="flex items-center gap-2">
          <button 
            onclick="saveNodeDetails()" 
            class="flex-1 py-2 px-3 rounded-lg bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-bold hover:opacity-90 transition"
          >
            変更を保存
          </button>
          <button 
            onclick="deleteCurrentNode()" 
            id="deleteNodeBtn"
            class="py-2 px-3 rounded-lg border border-rose-200 text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950/40 font-bold transition"
          >
            削除
          </button>
        </div>
      </div>
    </div>
  </aside>

    // State Variables
    let treeData = null;
    let selectedNodeId = null;
    let scale = 1.0;
    let panX = 40;
    let panY = 80;
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let currentSearchTerm = "";
    let currentFilterStatus = "all";

    const STORAGE_KEY = "shadowlog_improvement_logic_tree_v3";

    // Initialize
    function init() {
      loadData();
      setupEventListeners();
      renderTree();
      updateZoomDisplay();
    }

    // Load from LocalStorage or Default
    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          treeData = JSON.parse(saved);
        } else {
          treeData = JSON.parse(JSON.stringify(INITIAL_TREE_DATA));
        }
      } catch (e) {
        console.warn("Failed to load saved tree, using defaults:", e);
        treeData = JSON.parse(JSON.stringify(INITIAL_TREE_DATA));
      }
    }

    // Save to LocalStorage
    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(treeData));
      } catch (e) {
        console.error("Failed to save tree:", e);
      }
    }

    // Reset Data
    function resetData() {
      if (confirm("ロジックツリーを初期データにリセットしますか？\n（編集した内容は破棄されます）")) {
        treeData = JSON.parse(JSON.stringify(INITIAL_TREE_DATA));
        saveData();
        closeDrawer();
        renderTree();
      }
    }

    // Find node by ID (Recursive)
    function findNode(id, node = treeData) {
      if (node.id === id) return node;
      if (node.children) {
        for (const child of node.children) {
          const found = findNode(id, child);
          if (found) return found;
        }
      }
      return null;
    }

    // Find parent of a node
    function findParentNode(id, node = treeData) {
      if (node.children) {
        for (const child of node.children) {
          if (child.id === id) return node;
          const found = findParentNode(id, child);
          if (found) return found;
        }
      }
      return null;
    }

    // Toggle Collapse
    function toggleCollapse(nodeId, e) {
      e.stopPropagation();
      const node = findNode(nodeId);
      if (node && node.children && node.children.length > 0) {
        node.collapsed = !node.collapsed;
        saveData();
        renderTree();
      }
    }

    function expandAll() {
      function traverse(n) {
        n.collapsed = false;
        if (n.children) n.children.forEach(traverse);
      }
      traverse(treeData);
      saveData();
      renderTree();
    }

    function collapseToRoots() {
      function traverse(n, depth = 0) {
        if (depth >= 1) n.collapsed = true;
        if (n.children) n.children.forEach(c => traverse(c, depth + 1));
      }
      traverse(treeData, 0);
      saveData();
      renderTree();
    }

    // Status Styling Helpers
    function getStatusBadge(status) {
      switch (status) {
        case "completed":
          return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 dark:bg-emerald-950/60 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-800">🚀 実装完了</span>`;
        case "in_progress":
          return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-50 text-blue-700 dark:bg-blue-950/60 dark:text-blue-400 border border-blue-200 dark:border-blue-800">⚡️ 進行中</span>`;
        case "idea":
          return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700 dark:bg-amber-950/60 dark:text-amber-400 border border-amber-200 dark:border-amber-800">💡 検討・アイディア</span>`;
        case "pending":
        default:
          return `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400 border border-slate-200 dark:border-slate-700">📌 課題・保留</span>`;
      }
    }

    function getPriorityTag(priority) {
      switch (priority) {
        case "high":
          return `<span class="text-[9px] font-extrabold text-rose-600 dark:text-rose-400">P1 高</span>`;
        case "medium":
          return `<span class="text-[9px] font-bold text-amber-600 dark:text-amber-400">P2 中</span>`;
        case "low":
        default:
          return `<span class="text-[9px] font-medium text-slate-400">P3 低</span>`;
      }
    }

    // Render Tree Recursively into DOM
    function renderTree() {
      const container = document.getElementById("nodesContainer");
      container.innerHTML = "";

      const rootEl = createNodeDOM(treeData, 0);
      container.appendChild(rootEl);

      // Re-draw connection SVG curves after DOM render
      requestAnimationFrame(() => {
        drawConnections();
      });
    }

    function createNodeDOM(node, depth = 0) {
      const isRoot = depth === 0;
      const isSelected = selectedNodeId === node.id;
      const hasChildren = node.children && node.children.length > 0;
      const isVisible = checkVisibility(node);

      const wrapper = document.createElement("div");
      wrapper.className = "flex items-center gap-12 my-2";
      wrapper.id = `wrapper-${node.id}`;

      // Node Card Element
      const card = document.createElement("div");
      card.id = `node-${node.id}`;
      card.onclick = () => openDrawer(node.id);

      const isMatch = currentSearchTerm && (
        node.title.toLowerCase().includes(currentSearchTerm.toLowerCase()) ||
        (node.summary && node.summary.toLowerCase().includes(currentSearchTerm.toLowerCase()))
      );

      // Width and padding based on depth
      const widthClass = isRoot ? "w-80" : depth === 1 ? "w-72" : "w-64";
      const bgClass = isRoot 
        ? "bg-gradient-to-br from-indigo-900 to-slate-900 text-white shadow-xl shadow-indigo-950/30 border-2 border-indigo-500/40"
        : isSelected
        ? "bg-white dark:bg-slate-900 ring-2 ring-indigo-500 shadow-xl border-transparent"
        : "bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 shadow-xs hover:border-slate-300 dark:hover:border-slate-700";

      const highlightClass = isMatch ? "ring-2 ring-amber-400 shadow-lg scale-102" : "";
      const opacityClass = !isVisible ? "opacity-30" : "opacity-100";

      card.className = `tree-node ${widthClass} p-3.5 rounded-2xl relative cursor-pointer ${bgClass} ${highlightClass} ${opacityClass}`;

      // Card Inner Content
      card.innerHTML = `
        <div class="flex items-start justify-between gap-2 mb-1.5">
          <div class="flex items-center gap-1.5 flex-wrap">
            ${isRoot ? `<span class="px-2 py-0.5 rounded-full text-[10px] font-black bg-indigo-500/30 text-indigo-300">CORE MISSION</span>` : getStatusBadge(node.status)}
            ${!isRoot && node.priority ? getPriorityTag(node.priority) : ""}
          </div>
          ${hasChildren ? `
            <button 
              onclick="toggleCollapse('${node.id}', event)"
              class="w-5 h-5 rounded-md flex items-center justify-center text-[10px] font-bold ${isRoot ? 'bg-white/20 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'} hover:scale-110 transition shrink-0"
              title="${node.collapsed ? '展開する' : '折りたたむ'}"
            >
              ${node.collapsed ? `+${node.children.length}` : '−'}
            </button>
          ` : `
            <button 
              onclick="promptAddChild('${node.id}', event)"
              class="w-5 h-5 rounded-md flex items-center justify-center text-xs font-bold text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 dark:hover:bg-slate-800 transition shrink-0"
              title="子アイディアを追加"
            >
              ＋
            </button>
          `}
        </div>

        <h3 class="text-xs sm:text-sm font-bold tracking-tight line-clamp-2 leading-snug ${isRoot ? 'text-white' : 'text-slate-900 dark:text-white'}">
          ${node.title}
        </h3>

        ${node.summary ? `
          <p class="text-[11px] mt-1 leading-relaxed line-clamp-2 ${isRoot ? 'text-indigo-200/80' : 'text-slate-500 dark:text-slate-400'}">
            ${node.summary}
          </p>
        ` : ''}
      `;

      wrapper.appendChild(card);

      // Render Children Container if expanded
      if (hasChildren && !node.collapsed) {
        const childrenContainer = document.createElement("div");
        childrenContainer.className = "flex flex-col gap-3 relative";
        childrenContainer.id = `children-${node.id}`;

        node.children.forEach(child => {
          const childDOM = createNodeDOM(child, depth + 1);
          childrenContainer.appendChild(childDOM);
        });

        wrapper.appendChild(childrenContainer);
      }

      return wrapper;
    }

    function checkVisibility(node) {
      if (currentFilterStatus === "all") return true;
      if (node.id === "root") return true;
      if (node.status === currentFilterStatus) return true;
      if (node.children) {
        return node.children.some(c => checkVisibility(c));
      }
      return false;
    }

    // Draw Smooth Bezier Curves between Parent and Children
    function drawConnections() {
      const svg = document.getElementById("connectionSvg");
      svg.innerHTML = "";

      const canvasRect = document.getElementById("nodesContainer").getBoundingClientRect();

      function connectNodes(node) {
        if (!node.children || node.collapsed) return;

        const parentCard = document.getElementById(`node-${node.id}`);
        if (!parentCard) return;

        const parentRect = parentCard.getBoundingClientRect();
        // Right middle anchor point of parent card
        const startX = (parentRect.right - canvasRect.left) / scale;
        const startY = (parentRect.top + parentRect.height / 2 - canvasRect.top) / scale;

        node.children.forEach(child => {
          const childCard = document.getElementById(`node-${child.id}`);
          if (!childCard) return;

          const childRect = childCard.getBoundingClientRect();
          // Left middle anchor point of child card
          const endX = (childRect.left - canvasRect.left) / scale;
          const endY = (childRect.top + childRect.height / 2 - canvasRect.top) / scale;

          // Bezier control points for smooth S-curve
          const deltaX = (endX - startX) * 0.55;
          const d = `M ${startX} ${startY} C ${startX + deltaX} ${startY}, ${endX - deltaX} ${endY}, ${endX} ${endY}`;

          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", d);
          path.setAttribute("fill", "none");
          path.setAttribute("stroke", child.status === "completed" ? "#10b981" : child.status === "in_progress" ? "#6366f1" : "#94a3b8");
          path.setAttribute("stroke-width", "2");
          path.setAttribute("stroke-opacity", "0.65");
          path.setAttribute("stroke-dasharray", child.status === "idea" ? "4,4" : "none");

          svg.appendChild(path);

          // Recursively connect children
          connectNodes(child);
        });
      }

      connectNodes(treeData);
    }

    // Pan & Zoom Logic
    function updateTransform() {
      const canvas = document.getElementById("treeCanvas");
      canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      updateZoomDisplay();
      requestAnimationFrame(drawConnections);
    }

    function updateZoomDisplay() {
      document.getElementById("zoomDisplay").textContent = `${Math.round(scale * 100)}%`;
    }

    function zoomIn() {
      scale = Math.min(2.0, scale + 0.15);
      updateTransform();
    }

    function zoomOut() {
      scale = Math.max(0.4, scale - 0.15);
      updateTransform();
    }

    function resetView() {
      scale = 0.95;
      panX = 60;
      panY = 60;
      updateTransform();
    }

    function setupEventListeners() {
      const viewport = document.getElementById("canvasViewport");

      viewport.addEventListener("mousedown", (e) => {
        // Only drag if clicking background or container, not nodes/buttons
        if (e.target.closest(".tree-node") || e.target.closest("button") || e.target.closest("aside") || e.target.closest("input")) {
          return;
        }
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
      });

      window.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
      });

      window.addEventListener("mouseup", () => {
        isDragging = false;
      });

      viewport.addEventListener("wheel", (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) {
          e.preventDefault();
          const zoomFactor = e.deltaY < 0 ? 1.08 : 0.92;
          scale = Math.max(0.35, Math.min(2.2, scale * zoomFactor));
          updateTransform();
        } else {
          // Normal scroll pans canvas
          panX -= e.deltaX * 0.8;
          panY -= e.deltaY * 0.8;
          updateTransform();
        }
      }, { passive: false });

      // Window resize re-draws curves
      window.addEventListener("resize", () => {
        drawConnections();
      });
    }

    // Drawer / Detail Edit Logic
    function openDrawer(nodeId) {
      selectedNodeId = nodeId;
      const node = findNode(nodeId);
      if (!node) return;

      const drawer = document.getElementById("detailDrawer");
      drawer.classList.remove("translate-x-full");

      document.getElementById("drawerBadge").innerHTML = getStatusBadge(node.status);
      document.getElementById("editTitle").value = node.title || "";
      document.getElementById("editStatus").value = node.status || "idea";
      document.getElementById("editPriority").value = node.priority || "medium";
      document.getElementById("editSummary").value = node.summary || "";
      document.getElementById("editNotes").value = node.notes || "";

      // Root cannot be deleted
      document.getElementById("deleteNodeBtn").style.display = node.id === "root" ? "none" : "block";

      renderTree();
    }

    function closeDrawer() {
      selectedNodeId = null;
      document.getElementById("detailDrawer").classList.add("translate-x-full");
      renderTree();
    }

    function saveNodeDetails() {
      if (!selectedNodeId) return;
      const node = findNode(selectedNodeId);
      if (!node) return;

      node.title = document.getElementById("editTitle").value.trim() || "無題のノード";
      node.status = document.getElementById("editStatus").value;
      node.priority = document.getElementById("editPriority").value;
      node.summary = document.getElementById("editSummary").value.trim();
      node.notes = document.getElementById("editNotes").value.trim();

      saveData();
      renderTree();
      document.getElementById("drawerBadge").innerHTML = getStatusBadge(node.status);
    }

    function promptAddChild(parentId, e) {
      if (e) e.stopPropagation();
      const parent = findNode(parentId);
      if (!parent) return;

      const title = prompt(`「${parent.title}」の配下に新しいアイディアや施策を追加します。\nタイトルを入力してください:`);
      if (title && title.trim()) {
        const newChild = {
          id: `node-${Date.now()}`,
          title: title.trim(),
          summary: "",
          status: "idea",
          priority: "medium",
          notes: "",
          collapsed: false
        };
        if (!parent.children) parent.children = [];
        parent.children.push(newChild);
        parent.collapsed = false;

        saveData();
        renderTree();
        openDrawer(newChild.id);
      }
    }

    function addChildNodeFromDrawer() {
      if (!selectedNodeId) return;
      promptAddChild(selectedNodeId);
    }

    function deleteCurrentNode() {
      if (!selectedNodeId || selectedNodeId === "root") return;
      const node = findNode(selectedNodeId);
      if (!node) return;

      if (confirm(`ノード「${node.title}」とその配下のアイディアを削除しますか？`)) {
        const parent = findParentNode(selectedNodeId);
        if (parent && parent.children) {
          parent.children = parent.children.filter(c => c.id !== selectedNodeId);
          saveData();
          closeDrawer();
          renderTree();
        }
      }
    }

    // Filter & Search
    function handleSearch(term) {
      currentSearchTerm = term.trim();
      renderTree();
    }

    function filterByStatus(status) {
      currentFilterStatus = status;
      renderTree();
    }

    // Export & Import
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(treeData, null, 2));
      const downloadAnchor = document.createElement("a");
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `shadowlog_improvement_tree_${new Date().toISOString().slice(0, 10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() {
      document.getElementById("importInput").click();
    }

    function handleImportFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed && parsed.id && parsed.children) {
            treeData = parsed;
            saveData();
            renderTree();
            alert("ロジックツリーを正常に読み込みました！");
          } else {
            alert("無効なロジックツリーデータです。JSONの構造をご確認ください。");
          }
        } catch (err) {
          alert("JSONの読み込みに失敗しました: " + err.message);
        }
      };
      reader.readAsText(file);
      event.target.value = "";
    }

    // Run on Mount
    window.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
