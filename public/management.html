<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShadowLog 収益化・推進マネジメントダッシュボード</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 sm:px-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-indigo-100">
          S
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold text-slate-900">ShadowLog Management</h1>
            <span class="px-2 py-0.5 text-xs font-semibold rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">
              統括ダッシュボード
            </span>
          </div>
          <p class="text-xs text-slate-500">収益化ロードマップ & ステージ別タスク進捗管理</p>
        </div>
      </div>

      <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
        <a href="/simulation.html" target="_blank" class="text-xs px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-300 font-bold hover:bg-emerald-100 transition shadow-xs flex items-center gap-1.5">
          <span>💰</span> 収益試算シミュレーター
        </a>
        <div class="text-right">
          <div class="text-xs text-slate-500">全体進捗率</div>
          <div class="text-lg font-bold text-indigo-600" id="totalProgressText">0%</div>
        </div>
        <div class="w-32 sm:w-44 bg-slate-200 rounded-full h-3 overflow-hidden">
          <div id="totalProgressBar" class="bg-indigo-600 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
        </div>
        <button onclick="resetToDefault()" class="text-xs px-2.5 py-1.5 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 transition">
          初期リセット
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 pt-8">

    <!-- KPI / Status Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-medium text-slate-500 uppercase tracking-wider">現在フォーカス</div>
        <div class="mt-1 text-xl font-bold text-slate-900 flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
          Stage 0 / 1
        </div>
        <div class="text-xs text-slate-500 mt-1">MVP品質向上 ＆ 課金基盤導入</div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-medium text-slate-500 uppercase tracking-wider">目標有料会員 (3ヶ月後)</div>
        <div class="mt-1 text-xl font-bold text-indigo-600">100 名</div>
        <div class="text-xs text-slate-500 mt-1">目標MRR: 約100,000円〜148,000円/月</div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-medium text-slate-500 uppercase tracking-wider">AI原価 & 粗利率（抑制後）</div>
        <div class="mt-1 text-xl font-bold text-slate-900">約 0.32 円 <span class="text-xs font-normal text-slate-500">/ 1回</span></div>
        <div class="text-xs text-emerald-600 font-medium mt-1">粗利率 58%〜70% を維持</div>
      </div>

      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <div class="text-xs font-medium text-slate-500 uppercase tracking-wider">残り未完了タスク</div>
        <div class="mt-1 text-xl font-bold text-amber-600" id="remainingTasksCount">-</div>
        <div class="text-xs text-slate-500 mt-1" id="completedTasksRatio">-</div>
      </div>
    </div>

    <!-- Filter & Add Task Bar -->
    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
      <!-- Filter Tabs -->
      <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-lg w-full md:w-auto">
        <button onclick="setFilter('all')" id="filter-all" class="filter-btn flex-1 md:flex-initial px-3 py-1.5 text-xs font-medium rounded-md bg-white text-slate-900 shadow-sm">
          すべて
        </button>
        <button onclick="setFilter('pending')" id="filter-pending" class="filter-btn flex-1 md:flex-initial px-3 py-1.5 text-xs font-medium rounded-md text-slate-600 hover:text-slate-900">
          未完了
        </button>
        <button onclick="setFilter('completed')" id="filter-completed" class="filter-btn flex-1 md:flex-initial px-3 py-1.5 text-xs font-medium rounded-md text-slate-600 hover:text-slate-900">
          完了済み
        </button>
      </div>

      <!-- Add New Task Form -->
      <form onsubmit="addTask(event)" class="flex flex-col sm:flex-row gap-2 w-full md:w-auto flex-1 md:max-w-xl md:justify-end">
        <select id="stageSelect" class="text-xs border border-slate-300 rounded-lg px-3 py-2 bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="0">Stage 0: コア体験 & MVP安定化</option>
          <option value="1">Stage 1: 課金・会員インフラ</option>
          <option value="2">Stage 2: クローズドβ & 定着検証</option>
          <option value="3">Stage 3: パブリックローンチ</option>
          <option value="4">Stage 4: スケール & LTV最大化</option>
        </select>
        <input type="text" id="taskInput" placeholder="新しいタスクを入力..." required class="text-xs border border-slate-300 rounded-lg px-3 py-2 flex-1 focus:outline-none focus:ring-2 focus:ring-indigo-500">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg transition shrink-0 shadow-sm">
          + 追加
        </button>
      </form>
    </div>

    <!-- Stage Sections -->
    <div id="stagesContainer" class="space-y-6"></div>

  </main>

  <script>
    const DEFAULT_STAGES = [
      {
        id: 0,
        title: "Stage 0: コア体験検証 & MVP安定化",
        badge: "現状フェーズ",
        badgeColor: "bg-emerald-100 text-emerald-800 border-emerald-300",
        description: "発話認識の精度、Diff判定、音声再生などのコア体験の完成度を高め、快適な学習ループを担保する。",
        tasks: [
          { id: "s0-1", text: "Whisper音声認識のレスポンス高速化（録音完了から結果表示まで2秒以内）", done: true },
          { id: "s0-2", text: "Diff差分エンジンとWPM計算の精度テスト（Vitest 100%パス達成）", done: true },
          { id: "s0-3", text: "無音録音・マイク拒否・ノイズ環境でのフォールバックUIの堅牢化", done: true },
          { id: "s0-4", text: "ゲスト体験でのカルテ保存 ＆ ログイン時のシームレスな同期", done: false },
          { id: "s0-5", text: "利用規約・プライバシーポリシーの整備（音声非学習ポリシーの明記）", done: false }
        ]
      },
      {
        id: 1,
        title: "Stage 1: 課金・会員インフラ構築",
        badge: "最優先タスク",
        badgeColor: "bg-indigo-100 text-indigo-800 border-indigo-300",
        description: "Stripe連携、無料/有料プランのアクセス制限、安全な定期課金決済の仕組みを実装する。",
        tasks: [
          { id: "s1-0", text: "プロジェクト専用メールアドレス（shadowlog.app@gmail.com）の作成", done: true },
          { id: "s1-1", text: "Stripeアカウント開設（Sandbox環境準備完了）", done: true },
          { id: "s1-1b", text: "Stripeテスト環境APIキー（pk_test, sk_test）の取得と環境変数設定", done: true },
          { id: "s1-2", text: "検証・テスター用 VIPホワイトリスト（特定メアド無制限）機能の実装", done: true },
          { id: "s1-3", text: "3段階チケット制（ゲスト5回 ＋ 登録後15回 ＋ Pro味見2回）の実装", done: true },
          { id: "s1-4", text: "ヘッダー残りチケットバッジ ＆ アップセル課金モーダルUIの実装", done: true },
          { id: "s1-5", text: "Stripe Checkout（月額500円/1,480円）決済連携エンドポイントの実装", done: true },
          { id: "s1-6", text: "【実務担当】Gitコミット ＆ GitHub経由でのVercel自動デプロイ", done: false }
        ]
      },
      {
        id: 2,
        title: "Stage 2: クローズドβ & 定着率検証",
        badge: "検証フェーズ",
        badgeColor: "bg-amber-100 text-amber-800 border-amber-300",
        description: "限定30〜50名のアーリーアダプターに利用してもらい、Day 7継続率40%超えを狙う。",
        tasks: [
          { id: "s2-1", text: "クローズドβテスター募集（Threads中心・友人知人から30名集客）", done: false },
          { id: "s2-2", text: "アクセス解析・イベントトラッキング導入（PostHogまたはGA4）", done: false },
          { id: "s2-3", text: "習慣化リマインド通知（ストリーク途切れ防止のメール/Web通知）", done: false },
          { id: "s2-4", text: "SNSシェア用OGP画像自動生成機能（「#今日のシャドーイング」拡散用）", done: false },
          { id: "s2-5", text: "テスターへの1on1インタビュー・価格納得感（月1,480円）の検証", done: false }
        ]
      },
      {
        id: 3,
        title: "Stage 3: パブリックローンチ & 収益化始動",
        badge: "拡大フェーズ",
        badgeColor: "bg-purple-100 text-purple-800 border-purple-300",
        description: "有料会員100名（月商12万円規模）の突破を目指す本格公開とPR施策。",
        tasks: [
          { id: "s3-1", text: "Zenn/Note開発ストーリー執筆「シャドテンが高すぎてAI版を個人開発した話」", done: false },
          { id: "s3-2", text: "Product Hunt & 各種SaaSディレクトリへの掲載・ローンチ", done: false },
          { id: "s3-3", text: "英語学習系マイクロインフルエンサーへの無償Pro体験オファー", done: false },
          { id: "s3-4", text: "SEO用比較ランディングページ（シャドテン vs ShadowLog 等）の公開", done: false },
          { id: "s3-5", text: "初期ローンチ限定「初月半額」または「年払い特割」キャンペーン実施", done: false }
        ]
      },
      {
        id: 4,
        title: "Stage 4: スケール & LTV最大化 (法人/拡張)",
        badge: "将来展望",
        badgeColor: "bg-slate-100 text-slate-800 border-slate-300",
        description: "有料会員1,000名（月商88万円〜）、法人プランや弱点特訓AIへの展開。",
        tasks: [
          { id: "s4-1", text: "PWA強化またはモバイルアプリ化（通知による継続率向上）", done: false },
          { id: "s4-2", text: "法人向け（B2B）一括管理ダッシュボード（社員の発話量・WPM監視）の設計", done: false },
          { id: "s4-3", text: "弱点音素（L/R, 連結音）自動抽出とパーソナライズ集中特訓機能", done: false },
          { id: "s4-4", text: "企業・スクール提携（導入トライアル営業の開始）", done: false }
        ]
      }
    ];

    let stages = [];
    let currentFilter = 'all';

    function init() {
      const saved = localStorage.getItem('shadowlog_mgmt_stages');
      if (saved) {
        try {
          stages = JSON.parse(saved);
        } catch (e) {
          stages = JSON.parse(JSON.stringify(DEFAULT_STAGES));
        }
      } else {
        stages = JSON.parse(JSON.stringify(DEFAULT_STAGES));
      }
      render();
    }

    function save() {
      localStorage.setItem('shadowlog_mgmt_stages', JSON.stringify(stages));
      render();
    }

    function resetToDefault() {
      if (confirm('チェック状態やタスクを初期状態にリセットしますか？')) {
        stages = JSON.parse(JSON.stringify(DEFAULT_STAGES));
        save();
      }
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('bg-white', 'text-slate-900', 'shadow-sm');
        btn.classList.add('text-slate-600');
      });
      const activeBtn = document.getElementById(`filter-${filter}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-white', 'text-slate-900', 'shadow-sm');
        activeBtn.classList.remove('text-slate-600');
      }
      render();
    }

    function toggleTask(stageId, taskId) {
      const stage = stages.find(s => s.id === stageId);
      if (!stage) return;
      const task = stage.tasks.find(t => t.id === taskId);
      if (!task) return;
      task.done = !task.done;
      save();
    }

    function deleteTask(stageId, taskId) {
      const stage = stages.find(s => s.id === stageId);
      if (!stage) return;
      stage.tasks = stage.tasks.filter(t => t.id !== taskId);
      save();
    }

    function addTask(e) {
      e.preventDefault();
      const stageId = parseInt(document.getElementById('stageSelect').value, 10);
      const text = document.getElementById('taskInput').value.trim();
      if (!text) return;

      const stage = stages.find(s => s.id === stageId);
      if (stage) {
        stage.tasks.push({
          id: `custom-${Date.now()}`,
          text: text,
          done: false
        });
        document.getElementById('taskInput').value = '';
        save();
      }
    }

    function render() {
      const container = document.getElementById('stagesContainer');
      container.innerHTML = '';

      let totalTasks = 0;
      let totalCompleted = 0;

      stages.forEach(stage => {
        const stageTotal = stage.tasks.length;
        const stageCompleted = stage.tasks.filter(t => t.done).length;
        const stagePercent = stageTotal > 0 ? Math.round((stageCompleted / stageTotal) * 100) : 0;

        totalTasks += stageTotal;
        totalCompleted += stageCompleted;

        // Filter tasks
        const filteredTasks = stage.tasks.filter(t => {
          if (currentFilter === 'pending') return !t.done;
          if (currentFilter === 'completed') return t.done;
          return true;
        });

        // Stage Card
        const card = document.createElement('div');
        card.className = "bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden transition";

        card.innerHTML = `
          <div class="p-5 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-3 bg-slate-50/50">
            <div>
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 text-xs font-semibold rounded border ${stage.badgeColor}">${stage.badge}</span>
                <h2 class="text-base font-bold text-slate-900">${stage.title}</h2>
              </div>
              <p class="text-xs text-slate-500 mt-1">${stage.description}</p>
            </div>
            <div class="flex items-center gap-3">
              <div class="text-right">
                <span class="text-xs font-semibold text-slate-700">${stageCompleted} / ${stageTotal} 完了</span>
                <span class="text-xs text-indigo-600 font-bold ml-1">(${stagePercent}%)</span>
              </div>
              <div class="w-24 bg-slate-200 rounded-full h-2">
                <div class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: ${stagePercent}%"></div>
              </div>
            </div>
          </div>
          <div class="p-4 divide-y divide-slate-100">
            ${filteredTasks.length === 0 ? `
              <div class="py-4 text-center text-xs text-slate-400">該当するタスクはありません</div>
            ` : filteredTasks.map(task => `
              <div class="py-3 flex items-start justify-between gap-3 group">
                <label class="flex items-start gap-3 cursor-pointer flex-1 select-none">
                  <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${stage.id}, '${task.id}')"
                    class="mt-0.5 w-4 h-4 text-indigo-600 border-slate-300 rounded focus:ring-indigo-500 cursor-pointer transition">
                  <span class="text-sm ${task.done ? 'line-through text-slate-400' : 'text-slate-800'} transition-colors leading-relaxed">
                    ${task.text}
                  </span>
                </label>
                <button onclick="deleteTask(${stage.id}, '${task.id}')" title="削除"
                  class="opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-500 p-1 rounded transition text-xs">
                  ✕
                </button>
              </div>
            `).join('')}
          </div>
        `;

        container.appendChild(card);
      });

      // Update Summary metrics
      const totalPercent = totalTasks > 0 ? Math.round((totalCompleted / totalTasks) * 100) : 0;
      document.getElementById('totalProgressText').innerText = `${totalPercent}%`;
      document.getElementById('totalProgressBar').style.width = `${totalPercent}%`;
      document.getElementById('remainingTasksCount').innerText = `${totalTasks - totalCompleted} 件`;
      document.getElementById('completedTasksRatio').innerText = `全 ${totalTasks} 件中 ${totalCompleted} 件達成`;
    }

    // Initialize
    init();
  </script>
</body>
</html>
